apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: boutique
  labels: 
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 046451669467.dkr.ecr.us-east-1.amazonaws.com/user-service:45dac87c8db6b0a0f2614c0e8db13ac16864076f
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3006"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: USERS_DB_URL

--- 

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: boutique
  labels:
    app: user-service
spec:
  selector:
    app: user-service
  ports:
    - name: http
      protocol: TCP
      port: 3006
      targetPort: 3006
  type: ClusterIP
