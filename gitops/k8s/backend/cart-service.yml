apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
        - name: cart-service
          image: 046451669467.dkr.ecr.us-east-1.amazonaws.com/cart-service:latest
          ports:
            - containerPort: 3007
          env:
            - name: NODE_ENV
              value: development
            - name: PORT
              value: "3007"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: boutique-secrets
                  key: CART_DB_URL
            - name: PRODUCTS_SERVICE_URL
              value: "http://product-service:3003"

---

apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: boutique
spec:
  selector:
    app: cart-service
  ports:
    - protocol: TCP
      port: 3007
      targetPort: 3007
  type: ClusterIP